[package]
name = "pixeval_subscription"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "macros"] }
tokio-util = { version = "0.7" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
parking_lot = "0.12"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uniffi = { version = "0.32", features = ["tokio"] }
pixeval_storage = { path = "../pixeval_storage" }
pixeval_mako = { path = "../pixeval_mako" }
pixeval_download = { path = "../pixeval_download" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
