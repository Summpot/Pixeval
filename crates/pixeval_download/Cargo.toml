[package]
name = "pixeval_download"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "macros", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
uniffi = { version = "0.32", features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
