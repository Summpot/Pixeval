[package]
name = "pixeval_storage"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.33", features = ["bundled"] }
parking_lot = "0.12"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uniffi = { version = "0.32" }

[dev-dependencies]
tempfile = "3"
