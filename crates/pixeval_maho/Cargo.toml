[package]
name = "pixeval_maho"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt"] }
bytes = "1"
thiserror = "2"
uniffi = { version = "0.32", features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
