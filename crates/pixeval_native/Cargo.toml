[package]
name = "pixeval_native"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
# Avalonia consumes the domain crates directly. Its export surface does not
# include the Flutter/Compose host adapters and their frontend-owned sessions.
desktop-frontend = []

[dependencies]
boltffi.workspace = true
uniffi = { workspace = true, features = ["tokio"] }
pixeval_filters.workspace = true
pixeval_cache.workspace = true
pixeval_maho.workspace = true
pixeval_mako.workspace = true
pixeval_download.workspace = true
pixeval_storage.workspace = true
pixeval_subscription.workspace = true
pixeval_config.workspace = true
pixeval_plugin.workspace = true
pixeval_mcp.workspace = true
pixeval_novel.workspace = true
pixeval_media.workspace = true
pixeval_booru.workspace = true
pixeval_saucenao.workspace = true
pixeval_update.workspace = true
tokio = { workspace = true, features = ["full"] }
parking_lot.workspace = true
chrono.workspace = true
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
sha2.workspace = true
zip.workspace = true
futures-util.workspace = true
url.workspace = true
async-compat.workspace = true
getrandom = "0.4"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(boltffi_metadata)"] }
