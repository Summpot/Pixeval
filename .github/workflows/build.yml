name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/*.md'
  pull_request:
    branches-ignore:
      - l10n_main

permissions:
  contents: read

jobs:
  test:
    name: Run unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          filter: tree:0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build pinned native extension fixture
        shell: pwsh
        run: ./scripts/build-m3e-extension-fixture.ps1 -OutputDirectory artifacts/m3e/extension-fixture

      - name: Build desktop and run unit and UI tests
        shell: pwsh
        run: |
          $fixture = Get-Content artifacts/m3e/extension-fixture/fixture.json -Raw | ConvertFrom-Json
          ./scripts/verify-m3e.ps1 -OutputDirectory artifacts/m3e/ci -ExtensionFixture $fixture.library

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3e-validation-${{ matrix.os }}
          path: |
            artifacts/m3e/ci
            artifacts/m3e/extension-fixture/*.log
            artifacts/m3e/extension-fixture/fixture.json
