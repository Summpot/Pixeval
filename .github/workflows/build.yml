name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/*.md'
  pull_request:
    branches-ignore:
      - l10n_main

permissions:
  contents: read

jobs:
  test:
    name: Run unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          filter: tree:0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build pinned native extension fixture
        shell: pwsh
        run: ./scripts/build-m3e-extension-fixture.ps1 -OutputDirectory artifacts/m3e/extension-fixture

      - name: Build desktop and run unit tests
        shell: pwsh
        run: |
          $fixture = Get-Content artifacts/m3e/extension-fixture/fixture.json -Raw | ConvertFrom-Json
          ./scripts/verify-m3e.ps1 -OutputDirectory artifacts/m3e/ci -ExtensionFixture $fixture.library

      - name: Verify native extension pages and settings contracts
        shell: pwsh
        run: |
          dotnet build tools/Pixeval.MigrationValidation/Pixeval.MigrationValidation.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fixture = Get-Content artifacts/m3e/extension-fixture/fixture.json -Raw | ConvertFrom-Json
          dotnet tools/Pixeval.MigrationValidation/bin/Release/net10.0/Pixeval.MigrationValidation.dll extensions artifacts/m3e/extension-pages $fixture.library
          exit $LASTEXITCODE

      - name: Verify offline navigation, search and login contracts
        shell: pwsh
        run: |
          $evidenceRoot = 'artifacts/m3e/offline-pages'
          New-Item -ItemType Directory -Path $evidenceRoot -ErrorAction Stop | Out-Null
          foreach ($mode in @('navigation', 'search', 'search-options', 'login')) {
            $modeDirectory = Join-Path $evidenceRoot $mode
            dotnet tools/Pixeval.MigrationValidation/bin/Release/net10.0/Pixeval.MigrationValidation.dll $mode $modeDirectory *> "$modeDirectory.log"
            $result = $LASTEXITCODE
            Get-Content "$modeDirectory.log" | Write-Host
            if ($result -ne 0) { exit $result }
          }

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3e-validation-${{ matrix.os }}
          path: |
            artifacts/m3e/ci
            artifacts/m3e/extension-fixture/*.log
            artifacts/m3e/extension-fixture/fixture.json
            artifacts/m3e/extension-pages/*.png
            artifacts/m3e/extension-pages/*.txt
            artifacts/m3e/offline-pages/*.log
            artifacts/m3e/offline-pages/*/*.png
            artifacts/m3e/offline-pages/*/*.txt
