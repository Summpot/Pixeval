[workspace]
members = [
    "crates/pixeval_native",
    "crates/pixeval_filters",
    "crates/pixeval_cache",
    "crates/pixeval_maho",
    "crates/pixeval_mako",
    "crates/pixeval_download",
    "crates/pixeval_storage",
    "crates/pixeval_subscription",
    "crates/pixeval_config",
    "crates/pixeval_plugin",
    "crates/pixeval_mcp",
    "crates/pixeval_novel",
    "crates/pixeval_media",
    "crates/pixeval_booru",
    "crates/pixeval_saucenao",
    "crates/pixeval_update",
]
resolver = "2"

[workspace.dependencies]
# Internal workspace crates
pixeval_booru = { path = "crates/pixeval_booru" }
pixeval_cache = { path = "crates/pixeval_cache" }
pixeval_config = { path = "crates/pixeval_config" }
pixeval_download = { path = "crates/pixeval_download" }
pixeval_filters = { path = "crates/pixeval_filters" }
pixeval_maho = { path = "crates/pixeval_maho" }
pixeval_mako = { path = "crates/pixeval_mako" }
pixeval_mcp = { path = "crates/pixeval_mcp" }
pixeval_media = { path = "crates/pixeval_media" }
pixeval_native = { path = "crates/pixeval_native" }
pixeval_novel = { path = "crates/pixeval_novel" }
pixeval_plugin = { path = "crates/pixeval_plugin" }
pixeval_saucenao = { path = "crates/pixeval_saucenao" }
pixeval_storage = { path = "crates/pixeval_storage" }
pixeval_subscription = { path = "crates/pixeval_subscription" }
pixeval_update = { path = "crates/pixeval_update" }

# External dependencies
async-compat = { version = "0.2", features = ["multi-thread"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query"] }
bytes = "1"
chrono = "0.4"
flate2 = "1.0"
foyer = "0.22"
foyer-common = "0.22"
futures = "0.3"
futures-util = "0.3"
hex = "0.4"
http = "1"
http-body-util = "0.1"
httpdate = "1.0"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio", "http1", "http2"] }
image = { version = "0.25", default-features = false }
libloading = "0.8"
lz4 = "1.28"
marked-yaml = "0.8"
md-5 = "0.10"
parking_lot = "0.12"
png = "0.17"
regex = "1"
rusqlite = { version = "0.33", features = ["bundled"] }
rustls-pki-types = "1"
semver = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = "0.7"
tower-service = "0.3"
uniffi = "0.32"
url = "2"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
