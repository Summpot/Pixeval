targets:
  $default:
    sources:
      include:
        - $package$
        - lib/**
        - test/**
        - pubspec.yaml
        - Cargo.toml
        - Cargo.lock
        - crates/**/Cargo.toml
        - crates/**/build.rs
        - crates/**/src/**
        - crates/**/rust-toolchain.toml
        - .cargo/**
      exclude:
        - '**/target/**'
    builders:
      uniffi_dart_generator:native_ffi:
        generate_for: [lib/src/native/*.ffi.yaml]
